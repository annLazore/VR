<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#1</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./StereoCamera.js"></script>
<script src="./Texture.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>A Conical Edge with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the cube to rotate it.<br>
(On a touch screen, you can use your finger.)</p>

<div style="margin-top: 20px">
    <label>Eye Separation:
        <input type="range" min="0.1" max="1.5" step="0.01" value="0.7" id="eyeSepSlider">
    </label>
    <span id="eyeSepValue">0.7</span><br>

    <label>Field of View (rad):
        <input type="range" min="0.1" max="1.5" step="0.01" value="0.4" id="fovSlider">
    </label>
    <span id="fovValue">0.4</span><br>

    <label>Near Clipping Distance:
        <input type="range" min="1" max="20" step="0.1" value="8.0" id="nearClipSlider">
    </label>
    <span id="nearClipValue">8.0</span><br>

    <label>Convergence Distance:
        <input type="range" min="1" max="40" step="0.5" value="14.0" id="convSlider">
    </label>
    <span id="convValue">14.0</span><br>
</div>



<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:rgb(20, 20, 20)"></canvas>
   <!-- Сховати його, бо ми малюємо кадри у шейдері -->
   <video id="webcam" autoplay playsinline muted style="display:none;"></video>   

</div>


</body></html>
